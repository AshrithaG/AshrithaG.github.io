<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Kendall tau by corpus size">
  <style>
    .bg{fill:none}
    .ax{stroke:#9aa0a6;stroke-width:1}
    .gl{stroke:#9aa0a6;stroke-width:.5;stroke-dasharray:3 3;opacity:.5}
    .bar{fill:#0052cc}
    .neg{fill:#c0392b}
    .lbl{fill:#5f6368;font:11px 'IBM Plex Mono',ui-monospace,monospace}
    .val{fill:#202124;font:600 11px 'IBM Plex Mono',ui-monospace,monospace}
    .ttl{fill:#202124;font:600 12.5px 'IBM Plex Sans',system-ui,sans-serif}
    .ref{stroke:#c0392b;stroke-width:1.2;stroke-dasharray:5 3}
    .refl{fill:#c0392b;font:600 10.5px 'IBM Plex Mono',ui-monospace,monospace}
    @media (prefers-color-scheme: dark){
      .ax,.gl{stroke:#7c828c}
      .lbl{fill:#a8afb8}
      .val,.ttl{fill:#eceef1}
      .bar{fill:#6b9bff}
      .neg{fill:#ff7a6b}
      .ref{stroke:#ff7a6b}
      .refl{fill:#ff7a6b}
    }
  </style>
<rect class="bg" width="640" height="300"/>
<text class="ttl" x="58" y="20">ROUGE-L ranks query rewriters against retrieval: Kendall tau by corpus size</text>
<text class="lbl" x="58" y="36">negative means ROUGE orders systems backwards; stable across a 4.8x scale-up</text>
