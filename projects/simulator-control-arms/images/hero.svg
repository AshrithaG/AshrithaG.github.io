<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Share of each reranker's real gain that the LLM judge credits: LambdaMART 89 percent, cross-encoder 82 percent, LLM reranker 60 percent">
<title>Share of each stage's real gain credited by the LLM judge</title>
  <style>
    .grid{stroke:#e4e4dd;stroke-width:1}
    .axis{stroke:#7c828c;stroke-width:1}
    .ref{stroke:#4a5058;stroke-width:1.25}
    .bar{fill:#0052cc}
    .barn{fill:#8a8f98}
    .lbl{fill:#4a5058;font:11px 'IBM Plex Mono',ui-monospace,monospace}
    .val{fill:#14161a;font:600 11.5px 'IBM Plex Mono',ui-monospace,monospace}
    .ttl{fill:#14161a;font:600 13px 'IBM Plex Sans',system-ui,sans-serif}
    @media (prefers-color-scheme: dark){
      .grid{stroke:#262a31} .axis{stroke:#767d87} .ref{stroke:#a8afb8}
      .bar{fill:#5a8def} .barn{fill:#6f757e}
      .lbl{fill:#a8afb8} .val,.ttl{fill:#eceef1}
    }
  </style>

  <text class="ttl" x="16" y="30">How much of each reranker's real gain the LLM judge credits</text>
  <text class="lbl" x="16" y="50">Against the QReCC answer key. 120 conversations, Qwen3-4B, direct wording, t=0</text>
  <text class="lbl" x="238" y="107" text-anchor="end">LambdaMART reranker</text>
  <rect class="bar" x="250" y="92" width="302.6" height="22" rx="2"/>
  <text class="val" x="560.6" y="108">89%</text>
  <text class="lbl" x="238" y="163" text-anchor="end">Cross-encoder reranker</text>
  <rect class="bar" x="250" y="148" width="278.8" height="22" rx="2"/>
  <text class="val" x="536.8" y="164">82%</text>
  <text class="lbl" x="238" y="219" text-anchor="end">LLM reranker</text>
  <rect class="barn" x="250" y="204" width="204.0" height="22" rx="2"/>
  <text class="val" x="462.0" y="220">60%</text>
  <line class="ref" x1="590" y1="82" x2="590" y2="236"/>
  <text class="lbl" x="590" y="74" text-anchor="middle">100% = the real gain</text>
  <text class="lbl" x="16" y="278">The judge ranks systems much as real users do, Kendall tau 0.8 overall, yet under-credits</text>
  <text class="lbl" x="16" y="292">the LLM reranker enough to move it from first to third on QuAC under every wording tried.</text>
</svg>