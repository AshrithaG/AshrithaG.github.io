<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Determinism throughput cost by batch size">
  <style>
    .ax{stroke:#9aa0a6;stroke-width:1}
    .gl{stroke:#9aa0a6;stroke-width:.5;stroke-dasharray:3 3;opacity:.5}
    .bar{fill:#c0392b}
    .lbl{fill:#5f6368;font:11px 'IBM Plex Mono',ui-monospace,monospace}
    .val{fill:#202124;font:600 11.5px 'IBM Plex Mono',ui-monospace,monospace}
    .ttl{fill:#202124;font:600 12.5px 'IBM Plex Sans',system-ui,sans-serif}
    @media (prefers-color-scheme: dark){
      .ax,.gl{stroke:#7c828c} .lbl{fill:#a8afb8}
      .val,.ttl{fill:#eceef1} .bar{fill:#ff7a6b}
    }
  </style>
<text class="ttl" x="54" y="20">What determinism costs in vLLM: throughput given up, by batch size</text>
<text class="lbl" x="54" y="36">Qwen3-1.7B, one RTX 4090, vLLM 0.28.0, CUDA graphs enabled, median of five timed repeats</text>
<line class="gl" x1="54" y1="202.0" x2="624" y2="202.0"/>
<text class="lbl" x="46" y="205.5" text-anchor="end">20%</text>
<line class="gl" x1="54" y1="150.0" x2="624" y2="150.0"/>
<text class="lbl" x="46" y="153.5" text-anchor="end">40%</text>
<line class="gl" x1="54" y1="98.0" x2="624" y2="98.0"/>
<text class="lbl" x="46" y="101.5" text-anchor="end">60%</text>
<line class="gl" x1="54" y1="46.0" x2="624" y2="46.0"/>
<text class="lbl" x="46" y="49.5" text-anchor="end">80%</text>
<rect class="bar" x="89.6" y="80.8" width="71.2" height="173.2" rx="2"/>
<text class="val" x="125.2" y="74.8" text-anchor="middle">66.6%</text>
<text class="lbl" x="125.2" y="270.0" text-anchor="middle">batch 1</text>
<text class="lbl" x="125.2" y="284.0" text-anchor="middle" style="font-size:9.5px">226&#8594;76 tok/s</text>
<rect class="bar" x="232.1" y="90.5" width="71.2" height="163.5" rx="2"/>
<text class="val" x="267.8" y="84.5" text-anchor="middle">62.9%</text>
<text class="lbl" x="267.8" y="270.0" text-anchor="middle">batch 4</text>
<text class="lbl" x="267.8" y="284.0" text-anchor="middle" style="font-size:9.5px">803&#8594;298 tok/s</text>
<rect class="bar" x="374.6" y="95.9" width="71.2" height="158.1" rx="2"/>
<text class="val" x="410.2" y="89.9" text-anchor="middle">60.8%</text>
<text class="lbl" x="410.2" y="270.0" text-anchor="middle">batch 16</text>
<text class="lbl" x="410.2" y="284.0" text-anchor="middle" style="font-size:9.5px">3,113&#8594;1,221 tok/s</text>
<rect class="bar" x="517.1" y="114.6" width="71.2" height="139.4" rx="2"/>
<text class="val" x="552.8" y="108.6" text-anchor="middle">53.6%</text>
<text class="lbl" x="552.8" y="270.0" text-anchor="middle">batch 64</text>
<text class="lbl" x="552.8" y="284.0" text-anchor="middle" style="font-size:9.5px">11,152&#8594;5,176 tok/s</text>
<line class="ax" x1="54" y1="254.0" x2="624" y2="254.0"/>
</svg>
