<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Goodput in requests per second at 32, 48 and 64 requests per second offered: fifo 9.62, 5.15, 4.25; full 8.25, 7.10, 7.19; edf 12.43, 14.86, 13.75">
<title>Goodput past saturation, by policy</title>
  <style>
    .grid{stroke:#e4e4dd;stroke-width:1}
    .axis{stroke:#7c828c;stroke-width:1}
    .b1{fill:#0052cc} .b2{fill:#7aa7e8} .b3{fill:#b9cdf0}
    .lbl{fill:#4a5058;font:11px 'IBM Plex Mono',ui-monospace,monospace}
    .val{fill:#14161a;font:600 11px 'IBM Plex Mono',ui-monospace,monospace}
    .ttl{fill:#14161a;font:600 13px 'IBM Plex Sans',system-ui,sans-serif}
    .sub{fill:#4a5058;font:11px 'IBM Plex Mono',ui-monospace,monospace}
    @media (prefers-color-scheme: dark){
      .grid{stroke:#262a31} .axis{stroke:#767d87}
      .b1{fill:#5a8def} .b2{fill:#3d6bb8} .b3{fill:#2b4a80}
      .lbl,.sub{fill:#a8afb8} .val,.ttl{fill:#eceef1}
    }
  </style>
  <text class="ttl" x="16" y="26">Goodput past saturation, by policy</text>
  <text class="sub" x="16" y="44">requests per second meeting their deadline, RTX 4090, median of 3 seeds</text>

  <line class="grid" x1="70" y1="300.0" x2="620" y2="300.0"/>
  <text class="lbl" x="62" y="304.0" text-anchor="end">0</text>
  <line class="grid" x1="70" y1="247.5" x2="620" y2="247.5"/>
  <text class="lbl" x="62" y="251.5" text-anchor="end">4</text>
  <line class="grid" x1="70" y1="195.0" x2="620" y2="195.0"/>
  <text class="lbl" x="62" y="199.0" text-anchor="end">8</text>
  <line class="grid" x1="70" y1="142.5" x2="620" y2="142.5"/>
  <text class="lbl" x="62" y="146.5" text-anchor="end">12</text>
  <line class="grid" x1="70" y1="90.0" x2="620" y2="90.0"/>
  <text class="lbl" x="62" y="94.0" text-anchor="end">16</text>
  <rect class="b3" x="90" y="173.7" width="40" height="126.3"/>
  <text class="val" x="110.0" y="168.7" text-anchor="middle">9.6</text>
  <text class="lbl" x="110.0" y="316" text-anchor="middle">fifo</text>
  <rect class="b2" x="136" y="191.7" width="40" height="108.3"/>
  <text class="val" x="156.0" y="186.7" text-anchor="middle">8.2</text>
  <text class="lbl" x="156.0" y="316" text-anchor="middle">full</text>
  <rect class="b1" x="182" y="136.9" width="40" height="163.1"/>
  <text class="val" x="202.0" y="131.9" text-anchor="middle">12.4</text>
  <text class="lbl" x="202.0" y="316" text-anchor="middle">edf</text>
  <text class="lbl" x="156" y="334" text-anchor="middle">32 req/s offered</text>
  <rect class="b3" x="260" y="232.4" width="40" height="67.6"/>
  <text class="val" x="280.0" y="227.4" text-anchor="middle">5.2</text>
  <rect class="b2" x="306" y="206.8" width="40" height="93.2"/>
  <text class="val" x="326.0" y="201.8" text-anchor="middle">7.1</text>
  <rect class="b1" x="352" y="105.0" width="40" height="195.0"/>
  <text class="val" x="372.0" y="100.0" text-anchor="middle">14.9</text>
  <text class="lbl" x="326" y="334" text-anchor="middle">48 req/s offered</text>
  <rect class="b3" x="430" y="244.2" width="40" height="55.8"/>
  <text class="val" x="450.0" y="239.2" text-anchor="middle">4.2</text>
  <rect class="b2" x="476" y="205.6" width="40" height="94.4"/>
  <text class="val" x="496.0" y="200.6" text-anchor="middle">7.2</text>
  <rect class="b1" x="522" y="119.5" width="40" height="180.5"/>
  <text class="val" x="542.0" y="114.5" text-anchor="middle">13.8</text>
  <text class="lbl" x="496" y="334" text-anchor="middle">64 req/s offered</text>
  <line class="axis" x1="70" y1="300" x2="620" y2="300"/>
</svg>
