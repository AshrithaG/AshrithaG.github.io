<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Speculative decoding speedup by window size">
  <style>
    .bg{fill:none}
    .ax{stroke:#9aa0a6;stroke-width:1}
    .gl{stroke:#9aa0a6;stroke-width:.5;stroke-dasharray:3 3;opacity:.5}
    .bar{fill:#0052cc}
    .neg{fill:#c0392b}
    .lbl{fill:#5f6368;font:11px 'IBM Plex Mono',ui-monospace,monospace}
    .val{fill:#202124;font:600 11px 'IBM Plex Mono',ui-monospace,monospace}
    .ttl{fill:#202124;font:600 12.5px 'IBM Plex Sans',system-ui,sans-serif}
    .ref{stroke:#c0392b;stroke-width:1.2;stroke-dasharray:5 3}
    .refl{fill:#c0392b;font:600 10.5px 'IBM Plex Mono',ui-monospace,monospace}
    @media (prefers-color-scheme: dark){
      .ax,.gl{stroke:#7c828c}
      .lbl{fill:#a8afb8}
      .val,.ttl{fill:#eceef1}
      .bar{fill:#6b9bff}
      .neg{fill:#ff7a6b}
      .ref{stroke:#ff7a6b}
      .refl{fill:#ff7a6b}
    }
  </style>
<rect class="bg" width="640" height="300"/>
<text class="ttl" x="52" y="20">Speculative decoding speedup vs window size (Qwen3-0.6B drafting for Qwen3-4B)</text>
<text class="lbl" x="52" y="36">draft cost = 0.649 of a target pass, so every window loses</text>
<line class="gl" x1="52" y1="208.3" x2="624" y2="208.3"/>
<text class="lbl" x="44" y="211.8" text-anchor="end">0.25x</text>
<line class="gl" x1="52" y1="162.7" x2="624" y2="162.7"/>
<text class="lbl" x="44" y="166.2" text-anchor="end">0.50x</text>
<line class="gl" x1="52" y1="117.0" x2="624" y2="117.0"/>
<text class="lbl" x="44" y="120.5" text-anchor="end">0.75x</text>
<line class="gl" x1="52" y1="71.4" x2="624" y2="71.4"/>
<text class="lbl" x="44" y="74.9" text-anchor="end">1.00x</text>
<line class="ref" x1="52" y1="71.4" x2="624" y2="71.4"/>
<text class="refl" x="624" y="65.4" text-anchor="end">break-even 1.00x</text>
<rect class="bar" x="104.4" y="94.9" width="59.5" height="159.1" rx="2"/>
<text class="val" x="134.2" y="88.9" text-anchor="middle">0.87x</text>
<text class="lbl" x="134.2" y="270.0" text-anchor="middle">k=1</text>
<rect class="bar" x="218.8" y="102.6" width="59.5" height="151.4" rx="2"/>
<text class="val" x="248.6" y="96.6" text-anchor="middle">0.83x</text>
<text class="lbl" x="248.6" y="270.0" text-anchor="middle">k=2</text>
<rect class="bar" x="333.2" y="126.4" width="59.5" height="127.6" rx="2"/>
<text class="val" x="363.0" y="120.4" text-anchor="middle">0.70x</text>
<text class="lbl" x="363.0" y="270.0" text-anchor="middle">k=4</text>
<rect class="bar" x="447.6" y="146.6" width="59.5" height="107.4" rx="2"/>
<text class="val" x="477.4" y="140.6" text-anchor="middle">0.59x</text>
<text class="lbl" x="477.4" y="270.0" text-anchor="middle">k=6</text>
<rect class="bar" x="562.0" y="161.3" width="59.5" height="92.7" rx="2"/>
<text class="val" x="591.8" y="155.3" text-anchor="middle">0.51x</text>
<text class="lbl" x="591.8" y="270.0" text-anchor="middle">k=8</text>
<line class="ax" x1="52" y1="254.0" x2="624" y2="254.0"/>
<text class="lbl" x="338.0" y="292" text-anchor="middle">draft window size k</text>
</svg>
