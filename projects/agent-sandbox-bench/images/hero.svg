<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="gVisor cost relative to runc: pure compute 1.00x, small files 1.08x, cold start 1.11x, git 3.48x, process spawns 7.14x">
<title>What gVisor costs, by workload</title>
  <style>
    .grid{stroke:#e4e4dd;stroke-width:1}
    .axis{stroke:#7c828c;stroke-width:1}
    .b1{fill:#0052cc} .b2{fill:#7aa7e8} .b3{fill:#b9cdf0}
    .lbl{fill:#4a5058;font:11px 'IBM Plex Mono',ui-monospace,monospace}
    .val{fill:#14161a;font:600 11px 'IBM Plex Mono',ui-monospace,monospace}
    .ttl{fill:#14161a;font:600 13px 'IBM Plex Sans',system-ui,sans-serif}
    .sub{fill:#4a5058;font:11px 'IBM Plex Mono',ui-monospace,monospace}
    @media (prefers-color-scheme: dark){
      .grid{stroke:#262a31} .axis{stroke:#767d87}
      .b1{fill:#5a8def} .b2{fill:#3d6bb8} .b3{fill:#2b4a80}
      .lbl,.sub{fill:#a8afb8} .val,.ttl{fill:#eceef1}
    }
  </style>
  <text class="ttl" x="16" y="26">What gVisor costs, by workload</text>
  <text class="sub" x="16" y="44">median of 7 runs, relative to the same container under runc</text>

  <text class="lbl" x="160" y="104" text-anchor="end">pure compute</text>
  <rect class="b3" x="170" y="90" width="52" height="20"/>
  <text class="val" x="230" y="105">1.00x</text>
  <text class="lbl" x="160" y="150" text-anchor="end">2,000 small files</text>
  <rect class="b3" x="170" y="136" width="57" height="20"/>
  <text class="val" x="235" y="151">1.08x</text>
  <text class="lbl" x="160" y="196" text-anchor="end">cold start</text>
  <rect class="b3" x="170" y="182" width="58" height="20"/>
  <text class="val" x="236" y="197">1.11x</text>
  <text class="lbl" x="160" y="242" text-anchor="end">git init + commit</text>
  <rect class="b1" x="170" y="228" width="183" height="20"/>
  <text class="val" x="361" y="243">3.48x</text>
  <text class="lbl" x="160" y="288" text-anchor="end">50 process spawns</text>
  <rect class="b1" x="170" y="274" width="375" height="20"/>
  <text class="val" x="553" y="289">7.14x</text>
  <line class="grid" x1="222" y1="80" x2="222" y2="320"/>
  <text class="sub" x="228" y="336">1x, runc</text>
</svg>
